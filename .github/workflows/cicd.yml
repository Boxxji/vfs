# Canonical caller: hanzo.yml is the one list of gates, and each job below runs
# one of them (`gates:`), so they run in parallel and none runs five minutes. The
# last job takes every gate the others do not name (`!`), so a gate added to
# hanzo.yml is run by default. Runs on the git-runner fleet at git.hanzo.ai, the only
# pool serving these labels. github.com resolves only .github/workflows and has no
# runner for them, so a caller placed there is a gate that cannot be scheduled.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  check:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      gates: 'check'
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
  race-a:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      gates: 'race-a'
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
  race-b:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      gates: 'race-b'
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
  race-c:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      gates: 'race-c'
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
  model:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      gates: 'model'
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
  realserver:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      gates: 'realserver'
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
  realserver-kill:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      gates: 'realserver-kill'
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
  mount:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      gates: 'mount'
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
  mount-signals:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      gates: 'mount-signals'
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
  mount-checkout:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      gates: 'mount-checkout'
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
  scale-a:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      gates: 'scale-a'
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
  scale-b:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      gates: 'scale-b'
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
  fuzz:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      gates: '!check,race-a,race-b,race-c,model,realserver,realserver-kill,mount,mount-signals,mount-checkout,scale-a,scale-b'
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
