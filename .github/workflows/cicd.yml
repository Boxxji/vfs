# Canonical caller: hanzo.yml is the one list of gates, and the matrix below runs
# each as a job of its own (`gates:`), so they run in parallel and none runs five
# minutes. The last entry takes every gate the others do not name (`!`), so a gate
# added to hanzo.yml is run by default. (Seven separate calls of the reusable
# workflow in one file are refused at startup; a matrix of calls is not.) Runs on
# the git-runner fleet at git.hanzo.ai, the only pool serving these labels.
# github.com resolves only .github/workflows and has no runner for them, so a
# caller placed there is a gate that cannot be scheduled.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        gates:
          - 'check'
          - 'race-a'
          - 'race-b'
          - 'race-c'
          - 'model'
          - 'realserver'
          - 'realserver-kill'
          - 'mount'
          - 'mount-signals'
          - 'mount-checkout'
          - 'scale-a'
          - 'scale-b'
          - '!check,race-a,race-b,race-c,model,realserver,realserver-kill,mount,mount-signals,mount-checkout,scale-a,scale-b'
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    with:
      gates: ${{ matrix.gates }}
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
