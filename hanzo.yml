# Go virtual filesystem with SQLite replication. Library + cmd/.
#
# Seven steps, run in parallel, each under five minutes:
#   unit        gofmt, vet, and the unit suite under the race detector (-short)
#   model       the tests that run random operations against a plain model, under the
#               race detector (-short); the complement of unit's skip list
#   realserver  the engine against a real Hanzo S3 server: every test that needs one
#   kill        a writer killed at random moments over the real server
#   mount       the FUSE front on a kernel mount, served from a child process
#   scale       the measurements: 100,000 files, a million inodes, sync cost, the
#               object budget, a checkout, a petabyte, amplification; without -race,
#               which only slows the hashing they measure (-short skips them)
#   fuzz        the model run over many more seeds, without -race
#
# realserver, kill and mount fail if a test they exist for did not run: a skip is a
# failure there, never a pass. The unit step runs without the real server and without
# a mount, and its skips are expected.
#
# The real server is built from a pinned commit of hanzoai/s3, not consumed as a
# release: the published releases are an older line without the own-storage server
# whose conditional writes the Head stands on, and `go install pkg@commit` is
# refused because that module carries a replace directive. A pinned commit is
# immutable, so the build is reproducible; it takes about a minute on four cores.
# Tests find the server as `s3` on PATH; there is no environment switch.
test:
  - name: unit
    run: |
      set -euo pipefail
      go build ./...
      go vet ./...
      go vet -tags fuse ./pkg/mount
      test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      go test -race -short -skip '^Test(Sparse|Model|TreeForced)' ./...
  - name: model
    run: |
      set -euo pipefail
      go test -race -short -count=1 -run '^Test(Sparse|Model|TreeForced)' .
  - name: realserver
    run: |
      set -euo pipefail
      S3_COMMIT=cbf3d650091a24f915aece9901e77bfef785721c
      ROOT=$PWD
      SRC=$(mktemp -d)
      mkdir -p bin
      git clone --quiet --filter=blob:none https://github.com/hanzoai/s3 "$SRC"
      git -C "$SRC" checkout --quiet "$S3_COMMIT"
      (cd "$SRC" && CGO_ENABLED=0 go build -trimpath -o "$ROOT/bin/s3" ./s3)
      export PATH="$ROOT/bin:$PATH"
      go test -count=1 -v -timeout 15m \
        -run '^(TestRealServerConforms|TestRealServerRaceStress|TestRealServerCAS|TestRealServerMultipartIsConditional|TestPrefixConfinement|TestCommitRateOnRealServer|TestGetPairsBodyWithVersion|TestSameRoundRace|TestFenceRefusesOlderRound|TestAttachNeedsAHigherRound|TestTakeoverLosesNoAcknowledgedCommit|TestRacingClaims|TestVolumeOnEveryStore)$' \
        . ./pkg/backend/s3 | tee realserver.log
      for t in TestRealServerConforms TestRealServerRaceStress TestRealServerCAS TestRealServerMultipartIsConditional \
               TestPrefixConfinement TestCommitRateOnRealServer TestGetPairsBodyWithVersion \
               TestSameRoundRace/hanzo-s3 TestFenceRefusesOlderRound/hanzo-s3 TestAttachNeedsAHigherRound/hanzo-s3 \
               TestTakeoverLosesNoAcknowledgedCommit/hanzo-s3 TestRacingClaims/hanzo-s3 TestVolumeOnEveryStore/hanzo-s3; do
        grep -q -- "--- PASS: $t " realserver.log || { echo "did not pass against the real server: $t"; exit 1; }
      done
  - name: kill
    run: |
      set -euo pipefail
      S3_COMMIT=cbf3d650091a24f915aece9901e77bfef785721c
      ROOT=$PWD
      SRC=$(mktemp -d)
      mkdir -p bin
      git clone --quiet --filter=blob:none https://github.com/hanzoai/s3 "$SRC"
      git -C "$SRC" checkout --quiet "$S3_COMMIT"
      (cd "$SRC" && CGO_ENABLED=0 go build -trimpath -o "$ROOT/bin/s3" ./s3)
      export PATH="$ROOT/bin:$PATH"
      go test -count=1 -v -timeout 15m -run '^TestKillOverRealServer$' . | tee kill.log
      grep -q -- '--- PASS: TestKillOverRealServer ' kill.log || { echo "TestKillOverRealServer did not pass"; exit 1; }
  - name: mount
    run: |
      set -euo pipefail
      go test -tags fuse -count=1 -v -timeout 10m ./pkg/mount | tee mount.log
      if grep -E -- '^\s*--- SKIP' mount.log | grep -v TestMountChild; then echo "a mount test skipped"; exit 1; fi
      grep -q -- '--- PASS: TestFUSEPetabyteTruncate ' mount.log || { echo "TestFUSEPetabyteTruncate did not pass"; exit 1; }
  - name: scale
    run: |
      set -euo pipefail
      go test -count=1 -timeout 15m -run '^(TestHundredThousandFiles|TestMillionInodes|TestSyncCostDoesNotGrowWithTheTree|TestObjectBudget150GiB|TestCheckoutCost|TestCommitPerClose|TestChunkedFilesCommitCost|TestObjectsPerThousandSmallFiles|TestAppendWithFsyncAmplification|TestColdReadAmplification|TestSmallWritesAmplifyMemory|TestSparsePetabyte|TestMillionEntryDirectory|TestSequentialWriteMemory|TestFlushLatency|TestSustainedWriteWithFsync)$' .
  - name: fuzz
    run: |
      set -euo pipefail
      go test -count=1 -timeout 15m -run '^TestModelFuzzMany$' .
